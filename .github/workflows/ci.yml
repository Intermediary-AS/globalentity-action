name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test

  rejects-bad-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: bad
        uses: ./
        continue-on-error: true
        with:
          api-key: gea_live_invalid
          number: DK22756214
      - name: Expect failure
        if: steps.bad.outcome != 'failure'
        run: exit 1

  live:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.GLOBALENTITY_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - id: vat
        if: env.HAS_KEY == 'true'
        uses: ./
        with:
          api-key: ${{ secrets.GLOBALENTITY_API_KEY }}
          type: vat
          country: DK
          number: '22756214'
          fail-on-unknown: false
      - if: env.HAS_KEY == 'true'
        run: echo "valid=${{ steps.vat.outputs.valid }} name=${{ steps.vat.outputs.name }}"
      - if: env.HAS_KEY == 'true'
        uses: ./
        with:
          api-key: ${{ secrets.GLOBALENTITY_API_KEY }}
          operation: search
          country: Norway
          query: '925615471'
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::Set the GLOBALENTITY_API_KEY secret to run the live tests."
